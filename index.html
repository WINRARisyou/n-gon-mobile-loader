<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>n-gon</title>
	<style>
		html, body, iframe {
			margin: 0px; 
			padding: 0px; 
			height: 100%;
			width: 100%;
			border: none;
			overflow: hidden;
		}
	</style>
	<link rel="shortcut icon" href="https://landgreen.github.io/n-gon/favicon.ico" type="image/x-icon">
	<link rel="manifest" href="manifest.json">
</head>
<body>
	<iframe id="ngon-frame"></iframe>

	<script>
		const baseURL = "https://landgreen.github.io/n-gon/";
		const mobileControlsScript = `
			<script>javascript: (async () => { const scriptText = await (await fetch('https://raw.githubusercontent.com/kgurchiek/n-gon-mobile/main/main.js')).text(); var script = document.createElement('script'); script.type = 'text/javascript'; script.textContent = scriptText; document.head.appendChild(script); })();<\/script>
		`;

		async function loadNGon() {
			const res = await fetch(baseURL + "index.html");
			let html = await res.text();

			// Rewrite all src/href to absolute paths unless they are already absolute
			html = html.replace(/(src|href)=["'](?!https?:\/\/|\/\/)([^"']+)["']/g, (match, attr, path) => {
				return `${attr}="${baseURL}${path}"`;
			});

			// Inject the mobile controls script before </body> tag
			html = html.replace(/<\/body>/i, `${mobileControlsScript}</body>`);

			const blob = new Blob([html], { type: "text/html" });
			const blobURL = URL.createObjectURL(blob);
			document.getElementById("ngon-frame").src = blobURL;
		}
		loadNGon();
	</script>
</body>
</html>
